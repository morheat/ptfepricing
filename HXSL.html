<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HXSL Series Heater Pricing Wizard</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { font-size: 24px; text-align: center; color: #2c3e50; margin-bottom: 25px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #34495e; }
        select, input[type="number"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
        .info-box { background-color: #fef9e7; border-left: 4px solid #f1c40f; padding: 10px; margin-bottom: 20px; font-size: 14px; color: #7f8c8d; }
        .results { margin-top: 30px; padding: 20px; background: #e8f4f8; border-radius: 8px; border-left: 5px solid #3498db; }
        .results div { margin-bottom: 10px; font-size: 18px; display: flex; align-items: center; }
        .results span { font-weight: bold; color: #2980b9; }
        
        #copy-btn { margin-left: 15px; padding: 4px 12px; font-size: 14px; cursor: pointer; border: 1px solid #bdc3c7; background-color: #fff; color: #2c3e50; border-radius: 4px; transition: all 0.2s; }
        #copy-btn:hover { background-color: #ecf0f1; }
        #copy-btn.copied { background-color: #2ecc71; color: white; border-color: #27ae60; }
    </style>
</head>
<body>

<div class="container">
    <h1>HXSL Series Pricing Wizard</h1>

  

    <div class="form-group">
        <label for="wattage">Wattage (W)</label>
        <select id="wattage" onchange="updateVoltages()">
            <option value="1000">1000</option>
            <option value="2000">2000</option>
            <option value="3000">3000</option>
            <option value="4000">4000</option>
            <option value="5000">5000</option>
            <option value="6000">6000</option>
        </select>
    </div>

    <div class="form-group">
        <label for="voltage">Voltage (V)</label>
        <select id="voltage" onchange="calculate()"></select>
    </div>

    <div class="form-group">
        <label for="fuse">Fuse</label>
        <select id="fuse" onchange="calculate()">
            <option value="P1">P1</option>
            <option value="P2">P2</option>
            <option value="P3">P3</option>
            <option value="P4">P4</option>
            <option value="P5">P5</option>
            <option value="P6">P6</option>
            <option value="P7">P7</option>
            <option value="P8">P8 (+$48)</option>
        </select>
    </div>

    <div class="form-group">
        <label for="conduit">Flexible lead length</label>
        <input type="number" id="conduit" value="48" min="1" oninput="calculate()">
  
    </div>

    <div class="results">
        <div>
            Part Number: <span id="out-part" style="margin-left: 5px;"></span>
            <button id="copy-btn" onclick="copyPart()">Copy</button>
        </div>
        <div>Retail Price: $<span id="out-price" style="margin-left: 5px;"></span></div>
        <div>Distributor Price: $<span id="out-dist-price" style="margin-left: 5px;"></span></div>
    </div>
</div>

<script>
    // HXSL Series Database
    const heaters = [
        { watts: 1000, volts: 120, part: "HXSL1000-**", price: 1380 },
        { watts: 1000, volts: 240, part: "HXSL1000-**", price: 1380 },
        
        { watts: 2000, volts: 120, part: "HXSL2000-**", price: 1465 },
        { watts: 2000, volts: 240, part: "HXSL2000-**", price: 1465 },
        { watts: 2000, volts: 480, part: "HXSL2000-**", price: 1465 },

        { watts: 3000, volts: 240, part: "HXSL3000-**", price: 2031 },
        { watts: 3000, volts: 480, part: "HXSL3000-**", price: 2031 },

        { watts: 4000, volts: 240, part: "HXSL4000-**", price: 2128 },
        { watts: 4000, volts: 480, part: "HXSL4000-**", price: 2128 },

        { watts: 5000, volts: 240, part: "HXSL5000-**", price: 2460 },
        { watts: 5000, volts: 480, part: "HXSL5000-**", price: 2460 },

        { watts: 6000, volts: 240, part: "HXSL6000-**", price: 2742 },
        { watts: 6000, volts: 480, part: "HXSL6000-**", price: 2742 },
    ];

    function updateVoltages() {
        const wSelect = parseInt(document.getElementById('wattage').value);
        const vSelect = document.getElementById('voltage');
        vSelect.innerHTML = ''; 

        // Extract unique voltages available for the chosen wattage
        const availableVoltages = [...new Set(heaters.filter(h => h.watts === wSelect).map(h => h.volts))];
        
        [120, 240, 480].forEach(v => {
            if (availableVoltages.includes(v)) {
                let opt = document.createElement('option');
                opt.value = v;
                opt.textContent = v + "V";
                vSelect.appendChild(opt);
            }
        });

        calculate();
    }

    function calculate() {
        const wSelect = parseInt(document.getElementById('wattage').value);
        const vSelect = parseInt(document.getElementById('voltage').value);
        const fuse = document.getElementById('fuse').value;
        const flexLength = parseInt(document.getElementById('conduit').value) || 48;
        
        const heater = heaters.find(h => h.watts === wSelect && h.volts === vSelect);
        if (!heater) return;

        let finalPrice = heater.price;
        let generatedPart = heater.part;

        // Process Fuse Surcharge
        generatedPart = generatedPart.replace('**', fuse);
        if (fuse === 'P8') {
            finalPrice += 48;
        }

        // Flex Lead Selection ($7 per inch over 48 inches)
        if (flexLength > 48) {
            generatedPart += "-X" + flexLength;
            const extraInches = flexLength - 48;
            finalPrice += (extraInches * 7); 
        }

        const distributorPrice = finalPrice * 0.65;

        // Output Values
        document.getElementById('out-part').innerText = generatedPart;
        document.getElementById('out-price').innerText = finalPrice.toFixed(2);
        document.getElementById('out-dist-price').innerText = distributorPrice.toFixed(2);
        
        // Reset Copy Button Styling
        const copyBtn = document.getElementById('copy-btn');
        copyBtn.innerText = 'Copy';
        copyBtn.classList.remove('copied');
    }

    function copyPart() {
        const partText = document.getElementById('out-part').innerText;
        navigator.clipboard.writeText(partText).then(() => {
            const btn = document.getElementById('copy-btn');
            btn.innerText = 'Copied!';
            btn.classList.add('copied');
            
            setTimeout(() => {
                btn.innerText = 'Copy';
                btn.classList.remove('copied');
            }, 2000);
        }).catch(err => {
            console.error('Failed to copy text: ', err);
        });
    }

    // Initialize
    window.onload = updateVoltages;
</script>

</body>
</html>
