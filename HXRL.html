<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HXRL Series Heater Pricing Wizard</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { font-size: 24px; text-align: center; color: #2c3e50; margin-bottom: 25px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #34495e; }
        select, input[type="number"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
        .checkbox-group { display: flex; align-items: center; margin-top: 10px; margin-bottom: 20px; }
        .checkbox-group input { width: auto; margin-right: 10px; width: 20px; height: 20px; }
        .results { margin-top: 30px; padding: 20px; background: #e8f4f8; border-radius: 8px; border-left: 5px solid #3498db; }
        .results div { margin-bottom: 10px; font-size: 18px; display: flex; align-items: center; }
        .results span { font-weight: bold; color: #2980b9; }
        
        #copy-btn { margin-left: 15px; padding: 4px 12px; font-size: 14px; cursor: pointer; border: 1px solid #bdc3c7; background-color: #fff; color: #2c3e50; border-radius: 4px; transition: all 0.2s; }
        #copy-btn:hover { background-color: #ecf0f1; }
        #copy-btn.copied { background-color: #2ecc71; color: white; border-color: #27ae60; }
    </style>
</head>
<body>

<div class="container">
    <h1>HXRL Series Pricing Wizard (Single Phase)</h1>

    <div class="form-group">
        <label for="wattage">Wattage (W)</label>
        <select id="wattage" onchange="updateVoltages()">
            <option value="1000">1000</option>
            <option value="2000">2000</option>
            <option value="3000">3000</option>
            <option value="4000">4000</option>
            <option value="5000">5000</option>
            <option value="6000">6000</option>
        </select>
    </div>

    <div class="form-group">
        <label for="voltage">Voltage (V)</label>
        <select id="voltage" onchange="updateSizes()"></select>
    </div>

    <div class="form-group">
        <label for="size">Configuration (Width x Length)</label>
        <select id="size" onchange="calculate()"></select>
    </div>

    <div class="form-group">
        <label for="fuse">Fuse</label>
        <select id="fuse" onchange="calculate()">
            <option value="P1">P1</option>
            <option value="P2">P2</option>
            <option value="P3">P3</option>
            <option value="P4">P4</option>
            <option value="P5">P5</option>
            <option value="P6">P6</option>
            <option value="P7">P7</option>
            <option value="P8">P8 (+$48)</option>
        </select>
    </div>

    <div class="checkbox-group">
        <input type="checkbox" id="guard" onchange="calculate()">
        <label for="guard" style="margin-bottom: 0;">Include Guard?</label>
    </div>

    <div class="form-group">
        <label for="conduit">Flexible lead length</label>
        <input type="number" id="conduit" value="48" min="1" oninput="calculate()">
        <small style="color:#7f8c8d;">Standard 48" (4 feet). Extra lengths add $7 per inch.</small>
    </div>

    <div class="results">
        <div>
            Part Number: <span id="out-part" style="margin-left: 5px;"></span>
            <button id="copy-btn" onclick="copyPart()">Copy</button>
        </div>
        <div>Amps: <span id="out-amps" style="margin-left: 5px;"></span> A</div>
        <div>Retail Price: $<span id="out-price" style="margin-left: 5px;"></span></div>
        <div>Distributor Price: $<span id="out-dist-price" style="margin-left: 5px;"></span></div>
    </div>
</div>

<script>
    // HXRL Series Database - Refactored to template string {v}
    const heaters = [
        { watts: 1000, label: 'Width 4", Length 19"', template: "HXRL1{v}04-19L-**", price: 1267, guard: 130 },
        { watts: 1000, label: 'Width 6", Length 13"', template: "HXRL1{v}06-13L-**", price: 1267, guard: 130 },
        { watts: 1000, label: 'Width 8", Length 10"', template: "HXRL1{v}08-10L-**", price: 1267, guard: 130 },

        { watts: 2000, label: 'Width 6", Length 25"', template: "HXRL2{v}06-25L-**", price: 1720, guard: 141 },
        { watts: 2000, label: 'Width 8", Length 19"', template: "HXRL2{v}08-19L-**", price: 1720, guard: 141 },
        { watts: 2000, label: 'Width 10", Length 15"', template: "HXRL2{v}10-15L-**", price: 1720, guard: 141 },
        { watts: 2000, label: 'Width 12", Length 13"', template: "HXRL2{v}12-13L-**", price: 1720, guard: 141 },
        { watts: 2000, label: 'Width 14", Length 11"', template: "HXRL2{v}14-11L-**", price: 1720, guard: 141 },

        { watts: 3000, label: 'Width 10", Length 23"', template: "HXRL3{v}10-23L-**", price: 2209, guard: 152 },
        { watts: 3000, label: 'Width 12", Length 19"', template: "HXRL3{v}12-19L-**", price: 2209, guard: 152 },
        { watts: 3000, label: 'Width 14", Length 16"', template: "HXRL3{v}14-16L-**", price: 2209, guard: 152 },
        { watts: 3000, label: 'Width 16", Length 14"', template: "HXRL3{v}16-14L-**", price: 2209, guard: 152 },
        { watts: 3000, label: 'Width 18", Length 13"', template: "HXRL3{v}18-13L-**", price: 2209, guard: 152 },

        { watts: 4000, label: 'Width 12", Length 25"', template: "HXRL4{v}12-25L-**", price: 2317, guard: 162 },
        { watts: 4000, label: 'Width 14", Length 22"', template: "HXRL4{v}14-22L-**", price: 2317, guard: 162 },
        { watts: 4000, label: 'Width 16", Length 19"', template: "HXRL4{v}16-19L-**", price: 2317, guard: 162 },
        { watts: 4000, label: 'Width 18", Length 17"', template: "HXRL4{v}18-17L-**", price: 2317, guard: 162 },
        { watts: 4000, label: 'Width 20", Length 15"', template: "HXRL4{v}20-15L-**", price: 2317, guard: 162 },

        { watts: 5000, label: 'Width 12", Length 31"', template: "HXRL5{v}12-31L-**", price: 2630, guard: 175 },
        { watts: 5000, label: 'Width 14", Length 27"', template: "HXRL5{v}14-27L-**", price: 2630, guard: 175 },
        { watts: 5000, label: 'Width 16", Length 23"', template: "HXRL5{v}16-23L-**", price: 2630, guard: 175 },
        { watts: 5000, label: 'Width 18", Length 21"', template: "HXRL5{v}18-21L-**", price: 2630, guard: 175 },

        { watts: 6000, label: 'Width 12", Length 36"', template: "HXRL6{v}12-36L-**", price: 2914, guard: 175 },
        { watts: 6000, label: 'Width 14", Length 30"', template: "HXRL6{v}14-30L-**", price: 2914, guard: 175 },
        { watts: 6000, label: 'Width 16", Length 26"', template: "HXRL6{v}16-26L-**", price: 2914, guard: 175 },
        { watts: 6000, label: 'Width 18", Length 21"', template: "HXRL6{v}20-21L-**", price: 2914, guard: 175 },
    ];

    // Map of voltages to their specific part number code digits
    const voltageCodes = {
        120: "1",
        240: "2",
        380: "3",
        480: "4",
        415: "5",
        600: "6",
        400: "7",
        208: "8",
        220: "9",
        200: "0"
    };

    function updateVoltages() {
        const wSelect = parseInt(document.getElementById('wattage').value);
        const vSelect = document.getElementById('voltage');
        vSelect.innerHTML = ''; 

        // All desired voltages
        const allVoltages = [120, 200, 208, 220, 240, 380, 400, 415, 480, 600];
        
        allVoltages.forEach(v => {
            // Apply standard factory rule: 600V not available on 5kW and 6kW heaters
            if (v === 600 && (wSelect === 5000 || wSelect === 6000)) {
                return; 
            }
            let opt = document.createElement('option');
            opt.value = v;
            opt.textContent = v + "V";
            vSelect.appendChild(opt);
        });

        updateSizes();
    }

    function updateSizes() {
        const wSelect = parseInt(document.getElementById('wattage').value);
        const sSelect = document.getElementById('size');
        sSelect.innerHTML = '';

        // Extract available Width x Length combinations for the chosen Wattage
        const availableHeaters = heaters.filter(h => h.watts === wSelect);
        
        availableHeaters.forEach(h => {
            let opt = document.createElement('option');
            opt.value = h.template;
            opt.textContent = h.label;
            sSelect.appendChild(opt);
        });

        calculate();
    }

    function calculate() {
        const wSelect = parseInt(document.getElementById('wattage').value);
        const vSelect = parseInt(document.getElementById('voltage').value);
        const selectedTemplateStr = document.getElementById('size').value;
        const fuse = document.getElementById('fuse').value;
        const includeGuard = document.getElementById('guard').checked;
        const flexLength = parseInt(document.getElementById('conduit').value) || 48;
        
        const heater = heaters.find(h => h.template === selectedTemplateStr);
        if (!heater) return;

        let finalPrice = heater.price;
        let generatedPart = heater.template;

        // 1. Inject Voltage Code into the Part Number
        const vCode = voltageCodes[vSelect] || "1";
        generatedPart = generatedPart.replace('{v}', vCode);

        // Process Fuse Surcharge
        generatedPart = generatedPart.replace('**', fuse);
        if (fuse === 'P8') {
            finalPrice += 48;
        }

        // Guard Selection
        if (includeGuard) {
            finalPrice += heater.guard;
        }

        // Flex Lead Selection ($7 per inch over 48 inches)
        if (flexLength > 48) {
            generatedPart += "-X" + flexLength;
            const extraInches = flexLength - 48;
            finalPrice += (extraInches * 7); 
        }

        // Calculate Single-Phase Amps (Power / Voltage)
        const amps = (wSelect / vSelect).toFixed(2);

        const distributorPrice = finalPrice * 0.65;

        // Output Values
        document.getElementById('out-part').innerText = generatedPart;
        document.getElementById('out-amps').innerText = amps;
        document.getElementById('out-price').innerText = finalPrice.toFixed(2);
        document.getElementById('out-dist-price').innerText = distributorPrice.toFixed(2);
        
        // Reset Copy Button Styling
        const copyBtn = document.getElementById('copy-btn');
        copyBtn.innerText = 'Copy';
        copyBtn.classList.remove('copied');
    }

    function copyPart() {
        const partText = document.getElementById('out-part').innerText;
        navigator.clipboard.writeText(partText).then(() => {
            const btn = document.getElementById('copy-btn');
            btn.innerText = 'Copied!';
            btn.classList.add('copied');
            
            setTimeout(() => {
                btn.innerText = 'Copy';
                btn.classList.remove('copied');
            }, 2000);
        }).catch(err => {
            console.error('Failed to copy text: ', err);
        });
    }

    window.onload = updateVoltages;
</script>

</body>
</html>
